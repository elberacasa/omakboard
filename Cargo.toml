[package]
name = "omakboard"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Tune Hall-effect keyboards on Omarchy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elberacasa/omakboard"
readme = "README.md"
keywords = ["keyboard", "hall-effect", "rapid-trigger", "omarchy", "hidraw"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
