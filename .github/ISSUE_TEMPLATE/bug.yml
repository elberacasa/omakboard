name: Bug
description: Something Omakboard did wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: omakboard doctor
      render: text
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: omakboard info
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      description: "`omakboard --version` and `omarchy version`"
    validations:
      required: true
  - type: textarea
    id: backup
    attributes:
      label: Backup
      description: >-
        If a change went wrong, the backup Omakboard saved before it
        (~/.local/state/omakboard/backups/). It holds your keyboard's settings and no personal data.
